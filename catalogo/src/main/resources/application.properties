spring.application.name=catalogo
server.port=8081

# Base de datos propia de este servicio (en memoria)
spring.datasource.url=jdbc:h2:mem:catalogo
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Mostrar el mensaje de error en las respuestas
server.error.include-message=always
# Spring Boot 4 renombro esta propiedad; esta es la que aplica
spring.web.error.include-message=always